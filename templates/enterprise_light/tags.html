{% include "header.html" %}

<section class="hero hero-inner">
	<div class="container">
		<span class="hero-label">Tags</span>
		<h1>标签云</h1>
		<p>共 {{ all_tags|length }} 个标签</p>
	</div>
</section>

<section>
	<div class="container">
		{% if all_tags %}
		<div class="tag-cloud-large">
			{% for t in all_tags %}
			<a href="/archives/tag_{{ t.slug }}.html" class="tag-item">{{ t.name }} <span class="tag-count">{{ t.count }}</span></a>
			{% endfor %}
		</div>
		{% else %}
		<p class="empty">还没有标签。</p>
		{% endif %}
	</div>
</section>

{% include "footer.html" %}
